        {"id":"V1-22","title":"Qualify every supported target","summary":"Execute the host/runtime/architecture and dependency matrix on disposable targets, with capability probes, repeatability, bounded cleanup and immutable evidence.","docs":"Publish tested host/runtime/architecture matrix and target-specific limitations; build the v1 site.","status":"planned","dependencies":["V1-05","V1-13","V1-14","V1-17","V1-18","V1-21"],"spec":["04-reuse-targets.md","14-verification-and-release.md","18-operational-contracts.md"]},
