        {"id":"V1-11","title":"Restore tmux layouts, status and titles","summary":"Deliver four layouts, navigation, configurable headers, status plugins, attention signals, Ghostty-compatible tab titles and safe local reload.","docs":"Publish tmux layouts, keymap, header/status and Ghostty title customization; build the v1 site.","status":"planned","dependencies":["V1-10"],"spec":["11-workspace-experience.md","19-configuration-realization.md"]},
        {"id":"V1-12","title":"Restore themes and prompts","summary":"Preserve 37 theme families, 76 variants, eight Starship presets, semantic mappings, accessibility modes and durable user overrides.","docs":"Publish theme gallery, prompt choices, native overrides and live-versus-rebuild behavior; build the v1 site.","status":"planned","dependencies":["V1-11"],"spec":["11-workspace-experience.md","customization.schema.json","19-configuration-realization.md"]},
        {"id":"V1-13","title":"Restore previews and LaTeX","summary":"Deliver Yazi and every media/data/archive preview, Vim and clipboard workflow, standalone viewers, multi-document LaTeX build/watch and read-only browser preview.","docs":"Publish Yazi/Vim preview controls, format limits and LaTeX build/watch/preview tasks; build the v1 site.","status":"planned","dependencies":["V1-05","V1-11"],"spec":["11-workspace-experience.md","19-configuration-realization.md"]},
        {"id":"V1-14","title":"Restore optional audio","summary":"Provide opt-in client tooling, output/input bridge and diagnostics while keeping host service setup externally authorized.","docs":"Publish audio opt-in, host prerequisites, privacy and troubleshooting per supported target; build the v1 site.","status":"planned","dependencies":["V1-05","V1-08"],"spec":["08-native-artifacts.md","11-workspace-experience.md"]},
        {"id":"V1-15","title":"Restore optional processkit integration","summary":"Install and verify pinned processkit content through supported interfaces, preserve forks and personal MCP entries, and keep harness-only workspaces independent.","docs":"Publish processkit opt-in, source pins, personal MCP preservation and independent harness use; build the v1 site.","status":"planned","dependencies":["V1-05","V1-10"],"spec":["11-workspace-experience.md","12-migration-and-state.md","19-configuration-realization.md"]},
        {"id":"V1-16","title":"Deliver doctor and task-sized guidance","summary":"Provide read-only contextual diagnostics, effective configuration provenance and versioned MCP how-to resources generated from public documentation.","docs":"Publish doctor finding/remediation reference and synchronize task guides with MCP resources; build the v1 site.","status":"planned","dependencies":["V1-09","V1-11","V1-12"],"spec":["10-interfaces-and-guidance.md","14-verification-and-release.md","18-operational-contracts.md"]}
