        {"id":"V1-18","title":"Add local diff and PR review","summary":"Integrate Git/delta/LazyGit and a qualified optional gh-dash workflow with explicit authorization for network writes and native-web fallback.","docs":"Publish local diff/PR review tasks, network-write boundaries and fallback paths; build the v1 site.","status":"planned","dependencies":["V1-05","V1-11"],"spec":["11-workspace-experience.md"]}
