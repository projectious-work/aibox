  "groups": [
    {
      "id": "foundation", "title": "Foundation and native workspace contract",
      "note": "A reproducible baseline, one Go core, and standard Dev Container artifacts",
      "phases": [
        {"id":"V1-01","title":"Establish the implementation baseline","summary":"Establish baseline fixtures, schema checks, the v0 parity inventory, native configuration examples and reproducible specification validation.","docs":"Document baseline fixtures and validation commands; record the existing local docs build result.","status":"in_progress","dependencies":[],"spec":["README.md","01-product.md","02-configuration.md","07-architecture.md","08-native-artifacts.md","15-documentation.md","18-operational-contracts.md","19-configuration-realization.md"],"devNote":"../../dev-notes/V1-01-implementation-baseline.md","evidence":["baseline-evidence.md"]},
        {"id":"V1-02","title":"Establish the shared v1 documentation build","summary":"Use the pinned v0 Hugo brand-theme module and local build for v1 without changing v0's current root; retain prior Docsy material as excluded migration history.","docs":"Document the repeatable local Hugo build, theme pin, v0/v1 navigation baseline and contributor update workflow; build both lines.","status":"in_progress","dependencies":["V1-01"],"spec":["15-documentation.md","14-verification-and-release.md"],"devNote":"../../dev-notes/V1-02-shared-documentation-build.md","evidence":["docs-foundation-evidence.md"]},
        {"id":"V1-03","title":"Establish the Go operation core and first runnable preview","summary":"Deliver the first runnable Go aibox executable with version/help and safe read-only CLI/MCP workspace inspection, backed by typed results, diagnostics, redaction, path safety, process cancellation, locking and offline black-box tests; do not expose unfinished host mutations or a second container engine.","docs":"Publish a customer-run read-only preview walkthrough and current limitations alongside maintainer architecture, operation-result/error contracts and integration examples; build the v1 site.","status":"done","implementationCommit":"05dd13b1556ff300cac77f08fbd628f966e807bc","dependencies":["V1-02"],"spec":["07-architecture.md","09-lifecycle.md","13-security.md","14-verification-and-release.md","15-documentation.md","18-operational-contracts.md"],"devNote":"../../dev-notes/V1-03-go-operation-core.md","evidence":["evidence/V1-03-05dd13b1/evidence.json","evidence/V1-03-05dd13b1/mcp-parity.txt"]},
        {"id":"V1-04","title":"Ship native workspace starters","summary":"Publish Templates without a default .aibox tree, a minimal directly runnable devcontainer.json, standard aibox home volume, custom-user/bind examples and the resolved native/Feature/runtime configuration ownership contract; demonstrate the starter through the V1-03 executable.","docs":"Publish runnable minimal and curated quick starts, native-file examples, persistence and custom-user guidance; build the v1 site.","status":"planned","dependencies":["V1-02","V1-03"],"spec":["08-native-artifacts.md","12-migration-and-state.md","19-configuration-realization.md"]},
        {"id":"V1-05","title":"Restore the complete optional tool catalog","summary":"Express every v0 tool, version and disable choice through Features or native packages without a parallel addon solver, with per-tool provenance and two-architecture tests.","docs":"Update tool and Feature selection/version/disable reference and compatibility limits; build the v1 site.","status":"planned","dependencies":["V1-04"],"spec":["04-reuse-targets.md","08-native-artifacts.md","05-acceptance.md","19-configuration-realization.md"]}
      ]
    },
    {
      "id": "operator", "title": "Safe operator interface",
      "note": "Layered settings and logging precede lifecycle delegation and expanded MCP/CLI adapters",
      "phases": [
        {"id":"V1-06","title":"Establish layered settings and diagnostic sinks","summary":"Resolve system/user/project/env-file/process-env/invocation settings with source authority and effective provenance; emit redacted structured logs to stderr, private rotating files and host collectors without mixing them with results or operation records.","docs":"Publish settings hierarchy, env/flag precedence, logging sinks and redaction/troubleshooting reference; build the v1 site.","status":"planned","dependencies":["V1-03"],"spec":["02-configuration.md","16-configuration-and-logging.md","process-settings.schema.json","log-event.schema.json"]},
        {"id":"V1-07","title":"Qualify native credential-transfer paths","summary":"Document and test credential-free startup, scoped file/agent/env/BuildKit delivery, portable SOPS and optional broker integration with explicit host approval, canary absence, failure handling and cleanup.","docs":"Publish opt-in credential-transfer recipes, warnings, rotation and cleanup guidance; build the v1 site.","status":"planned","dependencies":["V1-04","V1-06"],"spec":["17-secrets-and-credential-transfer.md","13-security.md","05-acceptance.md"]},
        {"id":"V1-08","title":"Build, start, stop and remove exact environments","summary":"Delegate build/up/exec to pinned Dev Container CLI and fill only proven stop/remove gaps with native tooling, exact identity, retention and partial-failure evidence.","docs":"Publish lifecycle command examples, retention semantics and failure recovery; build the v1 site.","status":"planned","dependencies":["V1-03","V1-04","V1-06"],"spec":["09-lifecycle.md","16-configuration-and-logging.md","18-operational-contracts.md"]},
        {"id":"V1-09","title":"Expand guarded MCP and thin CLI","summary":"Extend the already paired Go CLI and local MCP server with read-only guidance by default and bounded authorized operations through shared Go use cases; prove identical CLI/MCP results, cancellation and client compatibility.","docs":"Publish complete CLI/MCP operations, authorization and response examples plus how-to resource index; build the v1 site.","status":"planned","dependencies":["V1-08","V1-06"],"spec":["03-interfaces.md","10-interfaces-and-guidance.md","16-configuration-and-logging.md","18-operational-contracts.md"]}
      ]
