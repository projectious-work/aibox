# aibox — corrected theme values
# Generated from the audit. Slot order matches cli/src/themes.rs.
# kind: canon = upstream correction · step = another step of the same palette
#       lift  = computed for contrast · kept = unchanged
# ratio = WCAG 2.1 contrast against this variant's background.

[meta]
source = "THEME-DESIGN-AGENT-BRIEFING.md (v0.x snapshot, 2026-08-20)"
families = 31
variants = 66
canonical_corrections = 53
contrast_corrections = 141
failing_pairs_before = 145
failing_pairs_after = 0

[floors]
fg = { min = 7, reason = "body text, read for hours — AAA for the one colour every character uses" }
muted = { min = 4.5, reason = "comments and metadata are text, not decoration — SC 1.4.3 applies" }
accent = { min = 4.5, reason = "accent is drawn as text (directories, titles, function names), not only as a fill" }
green = { min = 4.5, reason = "syntax + success status, both carrying text" }
red = { min = 4.5, reason = "syntax + error status — the one colour a user must never miss" }
yellow = { min = 4.5, reason = "syntax types + warning status" }
orange = { min = 4.5, reason = "numbers and constants — dense small glyphs" }
cyan = { min = 4.5, reason = "operators and info status" }
magenta = { min = 4.5, reason = "keywords/preprocessor once it becomes first-class" }
surface = { min = 1.2, reason = "status bars and popups must be *visible* against the page, not readable — a luminance step, not a text pair" }
pane_inactive_fg = { min = 3, reason = "deliberately dim, still legible: SC 1.4.3 large-text floor" }
border = { min = 3, reason = "non-text UI contrast, SC 1.4.11" }

