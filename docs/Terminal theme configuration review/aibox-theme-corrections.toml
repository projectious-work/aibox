# ── Emphasis — bold/italic/dim as a second channel ─────────────────────────
# Precedence: upstream theme fontStyle (harvested at build time from the tm theme)
#             → the aibox fallback spec below
#             → clamped by [emphasis.levels]
#             → clamped by [emphasis.tools] capability
# Degradation substitutes another channel; it never silently drops state.

[emphasis]
default = "auto"                       # auto | full | standard | minimal | none
probe_order = ["terminfo sitm/ritm", "terminfo dim", "TERM_PROGRAM", "NO_COLOR"]
no_color_forces = "none"

[emphasis.levels]
full     = ["bold", "italic", "dim", "underline", "strikethrough"]
standard = ["bold", "italic", "dim"]
minimal  = ["bold", "dim"]
none     = []

[emphasis.degradation]
italic        = "dim"      # comments must still read as secondary
underline     = "bold"     # current search match must stay distinct from other matches
strikethrough = "dim"      # deprecated stays de-emphasised
dim           = ""         # safe to drop; colour still separates it
bold          = ""         # never dropped

# Roles absent from this table are deliberately plain.
[emphasis.roles]
code_keyword    = { full = "bold", standard = "bold", minimal = "bold" }
code_type       = { full = "bold", standard = "bold", minimal = "bold" }
code_comment    = { full = "italic", standard = "italic", minimal = "dim" }
code_decorator  = { full = "italic", standard = "italic", minimal = "dim" }
code_invalid    = { full = "bold underline", standard = "bold", minimal = "bold" }
code_deprecated = { full = "strikethrough dim", standard = "dim", minimal = "dim" }
diff_emphasis   = { full = "bold", standard = "bold", minimal = "bold" }
diff_header     = { full = "bold", standard = "bold", minimal = "bold" }
diff_hunk       = { full = "dim", standard = "dim", minimal = "dim" }
status_error    = { full = "bold", standard = "bold", minimal = "bold" }
status_warning  = { full = "bold", standard = "bold", minimal = "bold" }
status_disabled = { full = "dim", standard = "dim", minimal = "dim" }
active_foreground        = { full = "bold", standard = "bold", minimal = "bold" }
pane_active_foreground   = { full = "bold", standard = "bold", minimal = "bold" }
inactive_foreground      = { full = "dim", standard = "dim", minimal = "dim" }
pane_inactive_foreground = { full = "dim", standard = "dim", minimal = "dim" }
search_current  = { full = "bold underline", standard = "bold", minimal = "bold" }
git_modified    = { full = "bold", standard = "bold", minimal = "bold" }
git_staged      = { full = "bold", standard = "bold", minimal = "bold" }
git_untracked   = { full = "italic", standard = "italic", minimal = "" }
git_ignored     = { full = "dim", standard = "dim", minimal = "dim" }
git_conflicted  = { full = "bold underline", standard = "bold", minimal = "bold" }

[emphasis.tools]
vim       = { supports = ["bold","italic","underline","undercurl","strikethrough","reverse"] }
tmux      = { supports = ["bold","dim","italics","underscore","reverse"], requires = "terminal-overrides sitm/ritm" }
yazi      = { supports = ["bold","dim","italic","underline","crossed","reverse"] }
eza       = { supports = ["bold","dim","italic","underline","strikethrough"] }
starship  = { supports = ["bold","italic","underline","dimmed","strikethrough","inverted"] }
delta     = { supports = ["bold","italic","underline"], note = "decorations only; syntax comes from the bat theme" }
bat       = { supports = ["bold","italic","underline"], requires = "generated .tmTheme" }
fzf       = { supports = ["bold","italic","underline","dim","reverse","strikethrough"], requires = "fzf >= 0.35 for italic/strikethrough" }
less      = { supports = ["bold","underline","standout"], note = "no italic — degrades to dim/standout" }
lnav      = { supports = ["bold","underline"] }
lazygit   = { supports = ["bold","underline","reverse"] }
claude_code = { supports = [] }
gemini    = { supports = [] }
opencode  = { supports = [] }
aider     = { supports = [], note = "inherited from the Pygments theme" }

# projectious — the brand's own weight/style map, shared by all five variants.
[emphasis.projectious]
shared_across_variants = true
keyword    = { brand = "700", attr = "bold" }
type       = { brand = "600", attr = "bold" }
invalid    = { brand = "600", attr = "bold", full = "bold underline" }
function   = { brand = "500", attr = "", note = "no terminal equivalent for weight 500 — stays plain" }
comment    = { brand = "400 italic", attr = "italic", minimal = "dim" }
decorator  = { brand = "400 italic", attr = "italic", minimal = "dim" }
other      = { brand = "400", attr = "" }

