name: docs-zensical
version: "1.0.0"
description: "Zensical – Python docs site"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["build-toolchain", "cli-binary"]
requires:
  - python

skills:
  - documentation

builder_weight: null

tools:
  - name: zensical
    description: "Python documentation site generator"
    default_enabled: true
    default_version: "0.0.52"
    supported_versions: ["0.0.43", "0.0.44", "0.0.47", "0.0.51", "0.0.52"]

builder: null

runtime: |
  # Addon: docs-zensical
  RUN UV_CACHE_DIR=/tmp/aibox-uv-cache uv tool install 'zensical=={{ tools.zensical.version }}' && \
      rm -rf /tmp/aibox-uv-cache
