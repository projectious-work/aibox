name: docs-mkdocs
version: "1.0.0"
description: "MkDocs – Python Markdown docs site"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["build-toolchain", "cli-binary"]
requires:
  - python

skills:
  - documentation

builder_weight: null

tools:
  - name: mkdocs
    description: "Python Markdown documentation site generator"
    default_enabled: true
    default_version: "1.6.1"
    supported_versions: ["1.6.1"]

builder: null

runtime: |
  # Addon: docs-mkdocs
  RUN UV_CACHE_DIR=/tmp/aibox-uv-cache uv tool install 'mkdocs=={{ tools.mkdocs.version }}' --with 'mkdocs-material==9.7.7' && \
      rm -rf /tmp/aibox-uv-cache
