name: infrastructure
version: "1.0.0"
description: "OpenTofu, Ansible, Packer"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: "medium"

skills:
  - terraform-basics

tools:
  - name: opentofu
    description: "Open-source Terraform-compatible infrastructure as code CLI"
    default_enabled: true
    default_version: "1.12.5"
    supported_versions: ["1.9.0", "1.12.0", "1.12.1", "1.12.3", "1.12.5"]
  - name: ansible
    description: "Configuration management and automation engine"
    default_enabled: true
    default_version: "14.2.0"
    supported_versions: ["13.7.0", "14.0.0", "14.1.0", "14.2.0"]
  - name: packer
    description: "Machine image build automation tool"
    default_enabled: true
    default_version: "1.16.0"
    supported_versions: ["1.11.2", "1.15.3", "1.15.4", "1.16.0"]

builder: |
  # ── Infrastructure builder ────────────────────────────────────────────
  FROM debian:trixie-slim AS infra-builder

  ENV DEBIAN_FRONTEND=noninteractive

  RUN apt-get update && apt-get install -y --no-install-recommends \
      ca-certificates \
      curl \
      unzip \
      && rm -rf /var/lib/apt/lists/*

  RUN mkdir -p /build/bin && \
  {% if tools.opentofu.enabled %}
      TOFU_VERSION="{{ tools.opentofu.version }}" && \
      ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')" && \
      TOFU_ARCHIVE="tofu_${TOFU_VERSION}_linux_${ARCH}.tar.gz" && \
      curl -fsSL "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/${TOFU_ARCHIVE}" -o "/tmp/${TOFU_ARCHIVE}" && \
      curl -fsSL "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS" -o /tmp/tofu_SHA256SUMS && \
      (cd /tmp && grep "${TOFU_ARCHIVE}$" tofu_SHA256SUMS | sha256sum -c -) && \
      tar -xz -C /build/bin -f "/tmp/${TOFU_ARCHIVE}" tofu && \
      rm "/tmp/${TOFU_ARCHIVE}" /tmp/tofu_SHA256SUMS{% if tools.packer.enabled %} && \
  {% endif %}
  {% endif %}
  {% if tools.packer.enabled %}
      ARCH="$(dpkg --print-architecture)" && \
      PACKER_VERSION="{{ tools.packer.version }}" && \
      PACKER_ARCHIVE="packer_${PACKER_VERSION}_linux_${ARCH}.zip" && \
      curl -fsSL "https://releases.hashicorp.com/packer/${PACKER_VERSION}/${PACKER_ARCHIVE}" \
        -o "/tmp/${PACKER_ARCHIVE}" && \
      curl -fsSL "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS" \
        -o /tmp/packer_SHA256SUMS && \
      (cd /tmp && grep "${PACKER_ARCHIVE}$" packer_SHA256SUMS | sha256sum -c -) && \
      unzip -q "/tmp/${PACKER_ARCHIVE}" -d /build/bin && \
      rm "/tmp/${PACKER_ARCHIVE}" /tmp/packer_SHA256SUMS
  {% endif %}

runtime: |
  # Addon: infrastructure (runtime)
  {% if tools.opentofu.enabled %}
  COPY --from=infra-builder /build/bin/tofu /usr/local/bin/tofu
  {% endif %}
  {% if tools.packer.enabled %}
  COPY --from=infra-builder /build/bin/packer /usr/local/bin/packer
  {% endif %}
  {% if tools.ansible.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
      python3-venv \
      && rm -rf /var/lib/apt/lists/*
  RUN python3 -m venv /opt/aibox/ansible && \
      /opt/aibox/ansible/bin/pip install --no-cache-dir 'ansible=={{ tools.ansible.version }}' && \
      for bin in /opt/aibox/ansible/bin/ansible*; do \
        ln -sf "$bin" "/usr/local/bin/$(basename "$bin")"; \
      done
  {% endif %}
  # ── Variant 1 disable-then-purge guards ───────────────────────────────
  {% if not tools.opentofu.enabled %}
  USER root
  RUN rm -f /usr/local/bin/tofu /usr/bin/tofu
  {% endif %}
  {% if not tools.packer.enabled %}
  USER root
  RUN rm -f /usr/local/bin/packer /usr/bin/packer
  {% endif %}
  {% if not tools.ansible.enabled %}
  USER root
  RUN rm -rf /opt/aibox/ansible && rm -f /usr/local/bin/ansible*
  {% endif %}
