name: kubernetes
version: "1.0.0"
description: "kubectl, Helm, Kustomize, k9s"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: "medium"

skills:
  - kubernetes-basics
  - container-orchestration

tools:
  - name: kubectl
    description: "Kubernetes command-line client"
    default_enabled: true
    default_version: "1.36.3"
    supported_versions: ["1.36.1", "1.36.2", "1.36.3"]
  - name: helm
    description: "Kubernetes package manager for charts"
    default_enabled: true
    default_version: "4.2.3"
    supported_versions: ["3.17.2", "4.2.0", "4.2.2", "4.2.3"]
  - name: kustomize
    description: "Kubernetes manifest overlay and patching tool"
    default_enabled: true
    default_version: "5.8.1"
    supported_versions: ["5.6.0", "5.8.1"]
  - name: k9s
    description: "Interactive terminal UI for Kubernetes clusters"
    default_enabled: false
    default_version: "0.51.0"
    supported_versions: ["0.50.18", "0.51.0"]

builder: |
  # ── Kubernetes builder ────────────────────────────────────────────────
  FROM debian:trixie-slim AS k8s-builder

  ENV DEBIAN_FRONTEND=noninteractive

  RUN apt-get update && apt-get install -y --no-install-recommends \
      ca-certificates \
      curl \
      && rm -rf /var/lib/apt/lists/*

  RUN mkdir -p /build/bin && \
  {% if tools.kubectl.enabled %}
      ARCH="$(dpkg --print-architecture)" && \
      KUBECTL_VERSION="v{{ tools.kubectl.version }}" && \
      curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"        -o /build/bin/kubectl && \
      curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl.sha256" -o /tmp/kubectl.sha256 && \
      echo "$(cat /tmp/kubectl.sha256)  /build/bin/kubectl" | sha256sum -c && \
      chmod +x /build/bin/kubectl && \
      rm /tmp/kubectl.sha256{% if tools.helm.enabled or tools.kustomize.enabled or tools.k9s.enabled %} && \
  {% endif %}
  {% endif %}
  {% if tools.helm.enabled %}
      HELM_VERSION="{{ tools.helm.version }}" && \
      ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')" && \
      HELM_ARCHIVE="helm-v${HELM_VERSION}-linux-${ARCH}.tar.gz" && \
      curl -fsSL "https://get.helm.sh/${HELM_ARCHIVE}" -o "/tmp/${HELM_ARCHIVE}" && \
      curl -fsSL "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum" -o "/tmp/${HELM_ARCHIVE}.sha256sum" && \
      (cd /tmp && sha256sum -c "${HELM_ARCHIVE}.sha256sum") && \
      tar -xz --strip-components=1 -C /build/bin -f "/tmp/${HELM_ARCHIVE}" "linux-${ARCH}/helm" && \
      rm "/tmp/${HELM_ARCHIVE}" "/tmp/${HELM_ARCHIVE}.sha256sum"{% if tools.kustomize.enabled or tools.k9s.enabled %} && \
  {% endif %}
  {% endif %}
  {% if tools.kustomize.enabled %}
      KUSTOMIZE_VERSION="{{ tools.kustomize.version }}" && \
      ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')" && \
      KUSTOMIZE_ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_${ARCH}.tar.gz" && \
      curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/${KUSTOMIZE_ARCHIVE}" -o "/tmp/${KUSTOMIZE_ARCHIVE}" && \
      curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/checksums.txt" -o /tmp/kustomize.checksums.txt && \
      (cd /tmp && grep "${KUSTOMIZE_ARCHIVE}$" kustomize.checksums.txt | sha256sum -c -) && \
      tar -xz -C /build/bin -f "/tmp/${KUSTOMIZE_ARCHIVE}" kustomize && \
      rm "/tmp/${KUSTOMIZE_ARCHIVE}" /tmp/kustomize.checksums.txt{% if tools.k9s.enabled %} && \
  {% endif %}
  {% endif %}
  {% if tools.k9s.enabled %}
      ARCH="$(dpkg --print-architecture)" && \
      K9S_VERSION="{{ tools.k9s.version }}" && \
      K9S_ARCHIVE="k9s_Linux_${ARCH}.tar.gz" && \
      curl -fsSL "https://github.com/derailed/k9s/releases/download/v${K9S_VERSION}/${K9S_ARCHIVE}" \
        -o "/tmp/${K9S_ARCHIVE}" && \
      curl -fsSL "https://github.com/derailed/k9s/releases/download/v${K9S_VERSION}/checksums.sha256" \
        -o /tmp/k9s_checksums.sha256 && \
      (cd /tmp && grep "${K9S_ARCHIVE}$" k9s_checksums.sha256 | sha256sum -c -) && \
      tar xz -C /build/bin -f "/tmp/${K9S_ARCHIVE}" k9s && \
      rm "/tmp/${K9S_ARCHIVE}" /tmp/k9s_checksums.sha256
  {% endif %}

runtime: |
  # Addon: kubernetes (runtime)
  {% if tools.kubectl.enabled %}
  COPY --from=k8s-builder /build/bin/kubectl /usr/local/bin/kubectl
  {% endif %}
  {% if tools.helm.enabled %}
  COPY --from=k8s-builder /build/bin/helm /usr/local/bin/helm
  {% endif %}
  {% if tools.kustomize.enabled %}
  COPY --from=k8s-builder /build/bin/kustomize /usr/local/bin/kustomize
  {% endif %}
  {% if tools.k9s.enabled %}
  COPY --from=k8s-builder /build/bin/k9s /usr/local/bin/k9s
  {% endif %}
  # ── Variant 1 disable-then-purge guards ───────────────────────────────
  # When a tool is explicitly disabled the binary must not survive in the
  # image — older base images may have shipped it. Treat disablement as an
  # absence contract.
  {% if not tools.kubectl.enabled %}
  USER root
  RUN rm -f /usr/local/bin/kubectl /usr/bin/kubectl
  {% endif %}
  {% if not tools.helm.enabled %}
  USER root
  RUN rm -f /usr/local/bin/helm /usr/bin/helm
  {% endif %}
  {% if not tools.kustomize.enabled %}
  USER root
  RUN rm -f /usr/local/bin/kustomize /usr/bin/kustomize
  {% endif %}
  {% if not tools.k9s.enabled %}
  USER root
  RUN rm -f /usr/local/bin/k9s /usr/bin/k9s
  {% endif %}
