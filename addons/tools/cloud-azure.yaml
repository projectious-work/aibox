name: cloud-azure
version: "1.0.0"
description: "Azure CLI"
profile_intent: runtime
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["cli-binary", "config-files"]
builder_weight: null

tools:
  - name: azure-cli
    description: "Azure command-line client for cloud resources"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: null

runtime: |
  # Addon: cloud-azure
  {% if tools["azure-cli"].enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
      python3-venv \
      && rm -rf /var/lib/apt/lists/*
  RUN python3 -m venv /opt/aibox/azure-cli && \
      /opt/aibox/azure-cli/bin/pip install --no-cache-dir azure-cli && \
      ln -sf /opt/aibox/azure-cli/bin/az /usr/local/bin/az
  {% endif %}
  {% if not tools["azure-cli"].enabled %}
  # Variant 1 disable-then-purge: azure-cli installs as a pip package.
  USER root
  RUN rm -rf /opt/aibox/azure-cli && rm -f /usr/local/bin/az
  {% endif %}
