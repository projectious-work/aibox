name: preview-archive
version: "1.0.0"
description: "Yazi image/PDF/SVG preview helpers plus archive preview/extraction tools"
profile_intent: preview-media
usage_class: automated
profiles: ["human-dev"]
exported_surfaces: ["previewer", "cli-binary", "config-files"]
builder_weight: "light"

tools:
  - name: chafa
    description: "Terminal image renderer used by Yazi image and SVG previews"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: librsvg
    description: "SVG conversion fallback via rsvg-convert"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: poppler
    description: "PDF text and image utilities for preview extraction"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: timg
    description: "Terminal image and PDF thumbnail viewer"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: mupdf
    description: "Lightweight PDF utilities for document previews"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: entr
    description: "File watcher used by live preview helpers"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: p7zip
    description: "Archive listing and extraction support for previews"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: resvg
    description: "High-quality SVG rasterizer for Yazi previews"
    default_enabled: true
    default_version: "0.47.0"
    supported_versions: ["0.47.0"]

builder: |
  # Addon: preview-archive (static preview/archive binaries)
  FROM debian:trixie-slim AS preview-archive-builder

  ENV DEBIAN_FRONTEND=noninteractive
  RUN apt-get update && apt-get install -y --no-install-recommends \
      ca-certificates \
      curl \
      && rm -rf /var/lib/apt/lists/*

  {% if tools.resvg.enabled %}
  ARG RESVG_SHA256_X86_64=5c84dcbcd032fe7e8d96e616fd6807a2f9df6561d2e6582b37e91e63c6cb4fe7
  RUN ARCH=$(uname -m) && \
      if [ "$ARCH" = "x86_64" ]; then \
        curl -fsSL \
          "https://github.com/linebender/resvg/releases/download/v{{ tools.resvg.version }}/resvg-linux-${ARCH}.tar.gz" \
          -o /tmp/resvg.tar.gz && \
        echo "${RESVG_SHA256_X86_64}  /tmp/resvg.tar.gz" | sha256sum -c - && \
        tar -xz -C /usr/local/bin -f /tmp/resvg.tar.gz resvg && \
        chmod +x /usr/local/bin/resvg && \
        rm /tmp/resvg.tar.gz; \
      else \
        printf '#!/bin/sh\necho "resvg: no upstream binary for %s (svg.yazi uses chafa fallback)" "$ARCH" >&2\nexit 1\n' "$ARCH" \
          > /usr/local/bin/resvg && \
        chmod +x /usr/local/bin/resvg; \
      fi
  {% endif %}

runtime: |
  # Addon: preview-archive — Yazi preview helpers and archive tools.
  USER root
  {% if tools.chafa.enabled or tools.librsvg.enabled or tools.poppler.enabled or tools.timg.enabled or tools.mupdf.enabled or tools.entr.enabled or tools.p7zip.enabled %}
  RUN apt-get update && apt-get install -y --no-install-recommends \
  {% if tools.chafa.enabled %}
      chafa \
  {% endif %}
  {% if tools.librsvg.enabled %}
      librsvg2-bin \
  {% endif %}
  {% if tools.poppler.enabled %}
      poppler-utils \
  {% endif %}
  {% if tools.timg.enabled %}
      timg \
  {% endif %}
  {% if tools.mupdf.enabled %}
      mupdf-tools \
  {% endif %}
  {% if tools.entr.enabled %}
      entr \
  {% endif %}
  {% if tools.p7zip.enabled %}
      p7zip-full \
  {% endif %}
      && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if tools.resvg.enabled %}
  COPY --from=preview-archive-builder /usr/local/bin/resvg /usr/local/bin/resvg
  {% endif %}
  # ── Variant 1 disable-then-purge guards ───────────────────────────────
  {% if not tools.chafa.enabled %}
  RUN if dpkg-query -W -f='${Status}' chafa 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove chafa; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.librsvg.enabled %}
  RUN if dpkg-query -W -f='${Status}' librsvg2-bin 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove librsvg2-bin; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.poppler.enabled %}
  RUN if dpkg-query -W -f='${Status}' poppler-utils 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove poppler-utils; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.timg.enabled %}
  RUN if dpkg-query -W -f='${Status}' timg 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove timg; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.mupdf.enabled %}
  RUN if dpkg-query -W -f='${Status}' mupdf-tools 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove mupdf-tools; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.entr.enabled %}
  RUN if dpkg-query -W -f='${Status}' entr 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove entr; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.p7zip.enabled %}
  RUN if dpkg-query -W -f='${Status}' p7zip-full 2>/dev/null | grep -q 'install ok installed'; then \
        apt-get purge -y --auto-remove p7zip-full; \
      fi && rm -rf /var/lib/apt/lists/*
  {% endif %}
  {% if not tools.resvg.enabled %}
  RUN rm -f /usr/local/bin/resvg /usr/bin/resvg
  {% endif %}
