name: rust
version: "1.1.0"
description: "Rust toolchain via rustup"
profile_intent: build
usage_class: automated
profiles: ["human-dev", "headless-runner"]
exported_surfaces: ["language-runtime", "build-toolchain", "cli-binary"]
builder_weight: "medium"

skills:
  - rust-conventions
  - concurrency-patterns

tools:
  - name: rustc
    description: "Rust compiler toolchain installed via rustup"
    default_enabled: true
    default_version: "1.97.1"
    supported_versions: ["1.90", "1.91", "1.92", "1.93", "1.94", "1.94.1", "1.96.0", "1.96.1", "1.97.1"]
  - name: clippy
    description: "Rust linter for catching common mistakes and style issues"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: rustfmt
    description: "Rust code formatter"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: cargo-audit
    description: "Rust dependency vulnerability scanner"
    default_enabled: true
    default_version: ""
    supported_versions: []
  - name: x86_64-cross
    description: "Cross-compilation target support for x86_64 Linux"
    default_enabled: true
    default_version: ""
    supported_versions: []

builder: |
  # ── Rust builder ─────────────────────────────────────────────────────
  FROM debian:trixie-slim AS rust-builder

  ENV DEBIAN_FRONTEND=noninteractive

  RUN apt-get update && apt-get install -y --no-install-recommends \
      build-essential \
      pkg-config \
      libssl-dev \
      ca-certificates \
      curl \
      && rm -rf /var/lib/apt/lists/*

  # Install to /home/aibox paths regardless of builder HOME (which is /root)
  ENV CARGO_HOME=/home/aibox/.cargo RUSTUP_HOME=/home/aibox/.rustup

  # S7 — BR-SEC-HARDEN: download rustup-init binary and verify SHA-256 before
  # executing, replacing the previous curl-pipe-sh pattern.
  # The sha256 file is published by the Rust project alongside each rustup-init:
  #   https://static.rust-lang.org/rustup/dist/<arch>/rustup-init.sha256
  # The binary is served over HTTPS from static.rust-lang.org (CDN-backed) and
  # the checksum ties the download to the binary actually shipped by the project.
  RUN ARCH="$(uname -m)" && \
      curl --proto '=https' --tlsv1.2 -fsSL \
        "https://static.rust-lang.org/rustup/dist/${ARCH}-unknown-linux-gnu/rustup-init" \
        -o /tmp/rustup-init && \
      curl --proto '=https' --tlsv1.2 -fsSL \
        "https://static.rust-lang.org/rustup/dist/${ARCH}-unknown-linux-gnu/rustup-init.sha256" \
        -o /tmp/rustup-init.sha256 && \
      (cd /tmp && sha256sum -c rustup-init.sha256) && \
      chmod +x /tmp/rustup-init && \
      /tmp/rustup-init -y \
        --default-toolchain {{ tools.rustc.version }}{% if tools.clippy.enabled %} \
        --component clippy{% endif %}{% if tools.rustfmt.enabled %} \
        --component rustfmt{% endif %} && \
      rm /tmp/rustup-init /tmp/rustup-init.sha256

  ENV PATH="/home/aibox/.cargo/bin:${PATH}"

  {% if tools["cargo-audit"].enabled %}
  RUN cargo install cargo-audit --locked
  {% endif %}

  RUN install -d /usr/local/bin && \
      for bin in /home/aibox/.cargo/bin/*; do \
        ln -sf "$bin" "/usr/local/bin/$(basename "$bin")"; \
      done

  {% if tools["x86_64-cross"].enabled %}
  # Pre-install the x86_64 cross-compilation target in the builder where
  # rustup can freely download components (no directory or permission issues).
  RUN rustup target add x86_64-unknown-linux-gnu
  {% endif %}

runtime: |
  # Addon: rust (runtime — copy from builder)
  COPY --from=rust-builder /home/aibox/.cargo /home/aibox/.cargo
  COPY --from=rust-builder /home/aibox/.rustup /home/aibox/.rustup

  # COPY runs as root, so fix ownership before switching to the aibox user.
  RUN chown -R aibox:aibox /home/aibox/.cargo /home/aibox/.rustup

  RUN install -d /usr/local/bin && \
      for bin in /home/aibox/.cargo/bin/*; do \
        ln -sf "$bin" "/usr/local/bin/$(basename "$bin")"; \
      done

  # The builder stage has build-essential, but only the toolchain is copied to
  # the runtime image. Without a C linker and glibc startup objects, native
  # `cargo build` / `cargo test` and x86_64 cross-compilation both fail.
  # Install the minimum needed for native compilation, with optional
  # cross-compilation support for x86_64 Linux.
  RUN apt-get update && apt-get install -y --no-install-recommends \
      gcc \
      binutils \
      libc6-dev \
      pkg-config \
      libssl-dev \
  {% if tools["x86_64-cross"].enabled %}
      gcc-x86-64-linux-gnu \
      libc6-dev-amd64-cross \
  {% endif %}
      && rm -rf /var/lib/apt/lists/*

  {% if tools["x86_64-cross"].enabled %}
  # Write the cross-compilation linker config. The x86_64 target is already
  # included in the copied .rustup (added in the builder stage).
  USER aibox
  ENV RUSTUP_HOME=/home/aibox/.rustup CARGO_HOME=/home/aibox/.cargo
  RUN mkdir -p /home/aibox/.cargo && \
      printf '[target.x86_64-unknown-linux-gnu]\nlinker = "x86_64-linux-gnu-gcc"\n' \
      >> /home/aibox/.cargo/config.toml
  USER root
  {% endif %}
