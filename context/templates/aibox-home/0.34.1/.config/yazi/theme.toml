# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#58A6FF" }
hovered = { fg = "#FFFFFF", bg = "#254161" }
preview_hovered = { fg = "#FFFFFF", bg = "#254161" }
find_keyword = { fg = "#D29922" }
find_position = { fg = "#D2A8FF" }
marker_selected = { fg = "#3FB950", bg = "#3FB950" }
marker_copied = { fg = "#D2A8FF", bg = "#D2A8FF" }
marker_cut = { fg = "#F85149", bg = "#F85149" }

[tabs]
active = { fg = "#000000", bg = "#58A6FF" }
inactive = { fg = "#8B949E", bg = "#21252B" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#000000", bg = "#3FB950" }
normal_alt = { fg = "#3FB950", bg = "#21252B" }
select_main = { fg = "#000000", bg = "#58A6FF" }
select_alt = { fg = "#58A6FF", bg = "#21252B" }
unset_main = { fg = "#000000", bg = "#D2A8FF" }
unset_alt = { fg = "#D2A8FF", bg = "#21252B" }

[status]
overall = { fg = "#E6EDF3", bg = "#21252B" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#58A6FF" }
perm_read = { fg = "#D29922" }
perm_write = { fg = "#F85149" }
perm_exec = { fg = "#3FB950" }
perm_sep = { fg = "#8B949E" }
progress_label = { fg = "#E6EDF3" }
progress_normal = { fg = "#58A6FF", bg = "#21252B" }
progress_error = { fg = "#F85149", bg = "#21252B" }

[input]
border = { fg = "#58A6FF" }
title = { fg = "#58A6FF", bg = "#0D1117" }
value = { fg = "#E6EDF3", bg = "#0D1117" }
selected = { fg = "#FFFFFF", bg = "#254161" }

[pick]
border = { fg = "#58A6FF" }
active = { fg = "#D2A8FF" }
inactive = { fg = "#8B949E", bg = "#0D1117" }

[cmp]
border = { fg = "#58A6FF" }
active = { fg = "#D2A8FF" }
inactive = { fg = "#8B949E", bg = "#0D1117" }

[tasks]
border = { fg = "#58A6FF" }
title = { fg = "#58A6FF", bg = "#0D1117" }
hovered = { fg = "#FFFFFF", bg = "#254161" }

[which]
mask = { bg = "#21252B" }
cand = { fg = "#79C0FF" }
rest = { fg = "#8B949E" }
desc = { fg = "#D2A8FF" }
separator = "  "
separator_style = { fg = "#8B949E" }

[help]
on = { fg = "#79C0FF" }
run = { fg = "#D2A8FF" }
desc = { fg = "#E6EDF3", bg = "#0D1117" }
hovered = { fg = "#FFFFFF", bg = "#254161" }
footer = { fg = "#0D1117", bg = "#E6EDF3" }

[git]
modified = { fg = "#D29922" }
untracked = { fg = "#D2A8FF" }
added = { fg = "#3FB950" }
deleted = { fg = "#F85149" }
updated = { fg = "#58A6FF" }
ignored = { fg = "#8B949E" }

[filetype]
rules = [
    { url = "*/", fg = "#58A6FF" },
    { url = "*.rs", fg = "#DB6D28" },
    { url = "*.py", fg = "#D29922" },
    { url = "*.js", fg = "#D29922" },
    { url = "*.ts", fg = "#58A6FF" },
    { url = "*.sh", fg = "#3FB950" },
    { url = "*.toml", fg = "#79C0FF" },
    { url = "*.yaml", fg = "#79C0FF" },
    { url = "*.yml", fg = "#79C0FF" },
    { url = "*.json", fg = "#79C0FF" },
    { url = "*.kdl", fg = "#79C0FF" },
    { url = "*.html", fg = "#DB6D28" },
    { url = "*.css", fg = "#58A6FF" },
    { url = "*.md", fg = "#E6EDF3" },
    { url = "*.tex", fg = "#3FB950" },
    { url = "*.typ", fg = "#3FB950" },
    { url = "*.pdf", fg = "#F85149" },
    { url = "*.png", fg = "#D2A8FF" },
    { url = "*.jpg", fg = "#D2A8FF" },
    { url = "*.jpeg", fg = "#D2A8FF" },
    { url = "*.gif", fg = "#D2A8FF" },
    { url = "*.svg", fg = "#D2A8FF" },
    { url = "*.zip", fg = "#DB6D28" },
    { url = "*.tar*", fg = "#DB6D28" },
    { url = "*.gz", fg = "#DB6D28" },
    { url = "*.gitignore", fg = "#8B949E" },
    { url = ".env*", fg = "#F85149" },
    { url = "Dockerfile*", fg = "#58A6FF" },
    { url = "Makefile", fg = "#3FB950" },
    { url = "Cargo.toml", fg = "#DB6D28" },
    { url = "Cargo.lock", fg = "#8B949E" },
]
