baseURL: "https://projectious-work.github.io/aibox/"
title: aibox
description: "Reproducible AI workspaces from one aibox.toml"
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: true
module:
  imports:
    - path: github.com/projectious-work/brand-theme-hugo-vanilla
  mounts:
    - source: assets
      target: assets
    - source: node_modules/@tabler/icons/icons/outline
      target: assets/tabler-icons/outline
build:
  buildStats:
    enable: true
security:
  exec:
    allow: ["^(dart-)?sass$", "^go$", "^git$", "^node$", "^postcss$", "^tailwindcss$"]
markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
    lineNos: false
    guessSyntax: true
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 3
outputs:
  home: [HTML, RSS, SearchIndex, LLMS]
  page: [HTML, Markdown]
  section: [HTML, RSS, Print, Markdown]
outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true
  Print:
    mediaType: text/html
    baseName: print
    isHTML: true
    notAlternative: true
    permalinkable: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  Markdown:
    mediaType: text/markdown
    isPlainText: true
    permalinkable: true
pagination:
  pagerSize: 8
taxonomies:
  tag: tags
menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 10
    - name: Features
      pageRef: /features
      weight: 20
    - name: Themes
      pageRef: /themes
      weight: 30
    - name: Roadmap
      pageRef: /roadmap
      weight: 40
    - name: Change log
      pageRef: /changelog
      weight: 50
params:
  description: "Reproducible AI workspaces from one aibox.toml."
  github: "https://github.com/projectious-work/aibox"
  version: "v0.35.0"
  versionMenuLabel: "Releases"
  codeTheme: adaptive
  sidebarOpenDepth: 0
  sidebarSections: [docs]
  build:
    tailwind: true
  editURL:
    default: "https://github.com/projectious-work/aibox/edit/v0.x-dev/docs-site/content/"
  versions:
    - label: "Current: v0.x"
      url: "https://projectious-work.github.io/aibox/"
      note: current
