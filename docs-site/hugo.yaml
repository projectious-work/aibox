baseURL: "https://projectious-work.github.io/aibox/v1.x/"
title: aibox
description: "Go-based developer environments and AI-ready workspace tools"
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

module:
  imports:
    - path: github.com/projectious-work/brand-theme-hugo-vanilla
  mounts:
    - source: assets
      target: assets
    - source: node_modules/@tabler/icons/icons/outline
      target: assets/tabler-icons/outline

build:
  buildStats:
    enable: true

security:
  exec:
    allow: ["^(dart-)?sass$", "^go$", "^git$", "^node$", "^postcss$", "^tailwindcss$"]

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4

outputs:
  home: [HTML, RSS, SearchIndex, LLMS]
  page: [HTML, Markdown]
  section: [HTML, RSS, Print, Markdown]

outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true
  Print:
    mediaType: text/html
    baseName: print
    isHTML: true
    notAlternative: true
    permalinkable: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  Markdown:
    mediaType: text/markdown
    isPlainText: true
    permalinkable: true

pagination:
  pagerSize: 8

params:
  version: "v1.x preview"
  versionMenuLabel: "Releases"
  description: "Go-based developer environments and AI-ready workspace tools."
  github: "https://github.com/projectious-work/aibox"
  codeTheme: adaptive
  sidebarOpenDepth: 0
  sidebarSections: [docs]
  build:
    tailwind: true
  editURL:
    default: "https://github.com/projectious-work/aibox/edit/v1.x-dev/docs-site/content/"
  versions:
    - label: "v0.x current"
      url: "https://projectious-work.github.io/aibox/"
      note: current
      probe: false
    - label: "v1.x preview"
      url: "https://projectious-work.github.io/aibox/v1.x/"
      note: preview
      probe: false

menu:
  main:
    - name: Documentation
      weight: 10
      pageRef: /docs
    - name: Features
      weight: 20
      pageRef: /features
    - name: Themes
      weight: 30
      pageRef: /themes
    - name: Roadmap
      weight: 40
      pageRef: /roadmap
    - name: Change log
      weight: 50
      pageRef: /changelog
    - name: GitHub
      weight: 60
      url: "https://github.com/projectious-work/aibox"

taxonomies:
  tag: tags
  category: categories
