{{ define "main" }}
<div class="shell">
  <main id="main">
    <div class="hero">
      <div class="hero__eyebrow">{{ site.Title }} · v1.x preview</div>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </div>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <div id="theme-gallery" data-index="{{ "asciinema/themes/index.json" | relURL }}"
       data-base="{{ "asciinema/themes/" | relURL }}">
      <p role="status">Loading theme recordings…</p>
    </div>
  </div>
  </main>
</div>
{{ partial "script.html" (dict "src" "js/theme-gallery.js" "defer" true) }}
{{ end }}
