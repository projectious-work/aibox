# Project-specific compose override — e2e test companion container.
# Docker Compose merges this with the generated docker-compose.yml.
# This file is never overwritten by `aibox sync`.

services:
  aibox:
    build:
      target: aibox
    depends_on:
      - aibox-e2e-testrunner
    # Guardrail for runaway terminal/status/plugin loops. Normal Rust builds
    # stay well below this; a bad loop now fails inside the container before it
    # can consume host/runtime-level PID space.
    pids_limit: 1200
    # Codex CLI uses bubblewrap for Linux sandboxing. The main aibox
    # container does not need privileged mode or SYS_ADMIN for that, but
    # Docker/Podman seccomp profiles can still block unprivileged user
    # namespace creation before bubblewrap gets control.
    # security_opt:
    #  - seccomp=unconfined
    ports:
      - "127.0.0.1:1316:1316"
    volumes:
      # Nested rootless Podman test cache: image store, local registry and
      # downloads for acceptance runs. One volume, so the host can drop every
      # cached build with `docker volume rm aibox-test-cache`.
      - aibox-test-cache:/var/cache/aibox-test
  # ── E2E Test Companion Container ───────────────────────────────────────────
  # Simulates a user's host machine for end-to-end testing of the aibox CLI.
  # No shared volumes — the test harness SCPs the aibox binary + addons into
  # the companion, making it a realistic simulation of a user's host machine.
  # Accessible from the devcontainer via:
  #   ssh -i /workspace/.aibox-e2e-runner-home/.ssh/id_ed25519 testuser@aibox-e2e-testrunner
  aibox-e2e-testrunner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: aibox-e2e-testrunner
    hostname: aibox-e2e-testrunner
    volumes:
      # SSH keys — mounted from host (never committed to git)
      - ../.aibox-e2e-runner-home/.ssh:/home/testuser/.ssh:ro
      # kind needs the host kernel module tree when it starts nested nodes.
      # Keep it read-only: the companion must never mutate host modules.
      - /lib/modules:/lib/modules:ro
    # Podman rootless inside a container needs:
    #   seccomp=unconfined  — allows syscalls used by user-namespace creation
    #   SYS_ADMIN           — allows newuidmap to write /proc/PID/uid_map
    # Safe here because the container has NO host mounts, NO host network,
    # and NO exposed ports — the capability is scoped to its own namespaces.
    # security_opt:
    #  - seccomp=unconfined
    security_opt:
      - seccomp=unconfined
    privileged: true
    # systemd is PID 1 inside a private cgroup namespace. It delegates a user
    # slice to testuser, where SSH-triggered kind runs in a Delegate=yes scope.
    # A private namespace confines systemd to this companion's subtree.
    cgroup: private
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    stop_grace_period: 30s

volumes:
  aibox-test-cache:
    # Fixed name, not prefixed with the compose project.
    name: aibox-test-cache
