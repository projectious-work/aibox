# Project-specific compose override for this repository's development service.
# Docker Compose merges this with the generated docker-compose.yml.
# This file is never overwritten by `aibox sync`.

services:
  aibox:
    build:
      target: aibox
    # Guardrail for runaway terminal/status/plugin loops. Normal Rust builds
    # stay well below this; a bad loop now fails inside the container before it
    # can consume host/runtime-level PID space.
    pids_limit: 1200
    # Codex CLI uses bubblewrap for Linux sandboxing. The main aibox
    # container does not need privileged mode or SYS_ADMIN for that, but
    # Docker/Podman seccomp profiles can still block unprivileged user
    # namespace creation before bubblewrap gets control.
    # security_opt:
    #  - seccomp=unconfined
    ports:
      - "127.0.0.1:1316:1316"
