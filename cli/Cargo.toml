[package]
name = "aibox"
version = "1.0.0-alpha.1"
edition = "2024"
description = "aibox — manage AI-ready development container environments"
license = "MIT"
repository = "https://github.com/projectious-work/aibox"
homepage = "https://github.com/projectious-work/aibox"

[[bin]]
name = "aibox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dialoguer = { version = "0.12", default-features = false }
minijinja = "2"
toml = "1"
toml_edit = "0.25"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver = { version = "1", features = ["serde"] }
ureq = "3"
dirs = "6"
anyhow = "1"
chrono = "0.4"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
tempfile = "3"

[features]
default = []
e2e = []
# Cell-level color assertion tests that replay tmux captures and asciinema
# casts through the vt100 parser. Surfaces (tmux/yazi/vim/starship) are
# gated by their own modules; `cargo test --test e2e --features e2e-render`
# enables them. Local-only surfaces (starship) work without a companion.
e2e-render = []

[dev-dependencies]
serial_test = "3"
ntest = "0.9"
vt100 = "0.16"
